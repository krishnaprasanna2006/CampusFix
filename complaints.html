<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - CampusFix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="dashboard-nav">
    <div class="logo">Campus<span>Fix</span></div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report</a>
        <a href="complaints.html">Complaints</a>
        <a href="campus-map.html">Map</a>
        <a href="analytics.html">Analytics</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<main class="dashboard">

    <div class="page-title">
        <h1>Complaints</h1>
        <p>View and track campus complaints.</p>
    </div>

    <div class="filter-bar">

        <input
            type="text"
            id="searchComplaint"
            placeholder="Search complaints...">

        <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
        </select>

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option>Electrical</option>
            <option>Infrastructure</option>
            <option>Cleanliness</option>
            <option>Water</option>
            <option>Internet</option>
            <option>Safety</option>
        </select>

    </div>

    <div id="complaintsList" class="complaints-grid"></div>

</main>

<script src="js/main.js"></script>
<script src="js/complaints.js"></script>
</body>
</html>
